<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gastos</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#171717;--muted:#777;--line:#e8e8e5;--accent:#171717;--danger:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif}
.app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 18px calc(90px + env(safe-area-inset-bottom))}
header{padding:24px 2px 16px;display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:0;font-weight:700}h2{font-size:20px;margin:0 0 14px}.month{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:var(--card);border-radius:22px;padding:20px;margin:10px 0;box-shadow:0 1px 2px #00000008}.balance{font-size:38px;font-weight:700;letter-spacing:-1.5px}.label{font-size:13px;color:var(--muted);margin-bottom:7px}.row{display:flex;justify-content:space-between;gap:12px}.stat{flex:1}.stat b{font-size:19px}.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin-top:15px}.progress>i{display:block;height:100%;background:#171717;border-radius:10px;width:0}
button{border:0;background:#171717;color:white;border-radius:16px;padding:14px 18px;font-size:16px;font-weight:600}button.secondary{background:#eee;color:#171717}.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:524px}
.list{margin-top:8px}.expense{display:flex;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.expense:last-child{border-bottom:0}.dot{width:42px;height:42px;border-radius:14px;background:#f0f0ed;display:grid;place-items:center;margin-right:12px;font-size:19px}.expense main{flex:1}.expense .name{font-weight:600}.expense small{color:var(--muted)}.amount{font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:3}nav button{background:transparent;color:#777;padding:9px 18px;font-size:12px}nav button.active{color:#171717;background:#eee}
section{display:none}.active-section{display:block}
input,select{width:100%;border:1px solid var(--line);background:#fafafa;border-radius:14px;padding:14px;font-size:17px;margin:6px 0 14px;outline:none}
.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:5}.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:auto}.sheet h2{margin-bottom:20px}.actions{display:flex;gap:10px}.actions button{flex:1}
.bar{display:flex;align-items:center;gap:10px;margin:13px 0}.bar span:first-child{width:85px;font-size:13px}.bar i{height:9px;background:#171717;border-radius:9px;display:block}.bar b{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Gastos</h1><div class="month" id="month"></div></div><button onclick="openSettings()" class="secondary">⚙︎</button></header>

<section id="home" class="active-section">
<div class="card"><div class="label">Disponible este mes</div><div class="balance" id="available">0,00 €</div><div class="progress"><i id="progress"></i></div></div>
<div class="card"><div class="row"><div class="stat"><div class="label">Gastado</div><b id="spent">0,00 €</b></div><div class="stat"><div class="label">Presupuesto</div><b id="budget">0,00 €</b></div><div class="stat"><div class="label">Por día</div><b id="daily">0,00 €</b></div></div></div>
<div class="card"><h2>Últimos gastos</h2><div id="recent" class="list"></div></div>
</section>

<section id="expenses"><div class="card"><h2>Gastos</h2><div id="allExpenses" class="list"></div></div></section>
<section id="stats"><div class="card"><h2>Este mes</h2><div id="statsContent"></div></div></section>
<section id="settings"><div class="card"><h2>Presupuesto mensual</h2><div class="label">Cuánto quieres gastar este mes</div><input id="budgetInput" type="number" inputmode="decimal" step="0.01" placeholder="1000"><button onclick="saveBudget()">Guardar presupuesto</button></div></section>
</div>

<button class="fab" onclick="openModal()">+ Añadir gasto</button>
<nav><button class="active" data-tab="home">Inicio</button><button data-tab="expenses">Gastos</button><button data-tab="stats">Estadísticas</button></nav>

<div class="modal" id="modal"><div class="sheet">
<h2>Nuevo gasto</h2>
<div class="label">Importe</div><input id="amount" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
<div class="label">Categoría</div><select id="category"><option>Comida</option><option>Transporte</option><option>Ocio</option><option>Compras</option><option>Casa</option><option>Otros</option></select>
<div class="label">Fecha</div><input id="date" type="date">
<div class="label">Nota</div><input id="note" type="text" placeholder="Opcional">
<div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button onclick="addExpense()">Guardar</button></div>
</div></div>

<script>
const key='gastos_minimal_v1';
let data=JSON.parse(localStorage.getItem(key)||'{"budget":1000,"expenses":[]}');
const icons={Comida:'🍴',Transporte:'🚗',Ocio:'◉',Compras:'⌁',Casa:'⌂',Otros:'•'};
function euro(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n)}
function monthKey(d){return d.slice(0,7)}
function current(){return new Date().toISOString().slice(0,7)}
function currentExpenses(){return data.expenses.filter(e=>monthKey(e.date)===current())}
function render(){
 const m=new Date(); document.getElementById('month').textContent=m.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
 const ex=currentExpenses(), spent=ex.reduce((s,e)=>s+e.amount,0), available=data.budget-spent;
 document.getElementById('spent').textContent=euro(spent);document.getElementById('budget').textContent=euro(data.budget);
 document.getElementById('available').textContent=euro(available);
 const days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(); const elapsed=Math.max(1,m.getDate());
 document.getElementById('daily').textContent=euro(Math.max(0,available)/(days-elapsed+1));
 document.getElementById('progress').style.width=Math.min(100,(spent/Math.max(data.budget,1))*100)+'%';
 renderList('recent',ex.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5));
 renderList('allExpenses',ex.slice().sort((a,b)=>b.date.localeCompare(a.date)));
 renderStats(ex); document.getElementById('budgetInput').value=data.budget||'';
}
function renderList(id,arr){
 const el=document.getElementById(id); if(!arr.length){el.innerHTML='<div class="empty">Todavía no hay gastos.</div>';return}
 el.innerHTML=arr.map(e=>`<div class="expense"><div class="dot">${icons[e.category]||'•'}</div><main><div class="name">${e.note||e.category}</div><small>${e.category} · ${new Date(e.date+'T12:00').toLocaleDateString('es-ES')}</small></main><div class="amount">−${euro(e.amount)}</div></div>`).join('');
}
function renderStats(ex){
 const totals={};ex.forEach(e=>totals[e.category]=(totals[e.category]||0)+e.amount);const max=Math.max(...Object.values(totals),1);
 document.getElementById('statsContent').innerHTML=Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="bar"><span>${c}</span><i style="width:${Math.max(5,v/max*55)}%"></i><b>${euro(v)}</b></div>`).join('')||'<div class="empty">Añade gastos para ver tus estadísticas.</div>';
}
function openModal(){document.getElementById('modal').style.display='flex';document.getElementById('date').value=new Date().toISOString().slice(0,10);setTimeout(()=>document.getElementById('amount').focus(),100)}
function closeModal(){document.getElementById('modal').style.display='none'}
function addExpense(){
 const amount=parseFloat(document.getElementById('amount').value);if(!amount||amount<=0)return;
 data.expenses.push({id:Date.now(),amount,category:document.getElementById('category').value,date:document.getElementById('date').value,note:document.getElementById('note').value.trim()});
 localStorage.setItem(key,JSON.stringify(data));document.getElementById('amount').value='';document.getElementById('note').value='';closeModal();render()
}
function saveBudget(){const v=parseFloat(document.getElementById('budgetInput').value);if(v>=0){data.budget=v;localStorage.setItem(key,JSON.stringify(data));render();show('home')}}
function openSettings(){show('settings')}
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.remove('active-section'));document.getElementById(id).classList.add('active-section');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function save(){localStorage.setItem(key,JSON.stringify(data))}
render();
</script>
</body>
</html>
